name: CI

on: [push, pull_request]

jobs:
  # 1. Проверка секретов (уже есть)
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: GitGuardian/ggshield-action@v1.26.0
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  # 2. Тесты бэкенда (Go)
  backend-test:
    runs-on: ubuntu-latest
    needs: security  # запускается после успешной проверки секретов
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: cd backend && go test ./... -v

  # 3. Сборка фронтенда (React)
  frontend-build:
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd frontend && npm ci && npm run build

  # 4. Сборка Docker-образов (проверка, что Dockerfile собирается)
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
