server {
  listen 443 ssl;
  http2 on;
  server_name 2.26.138.90 localhost _;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  client_max_body_size 10M;

  limit_req zone=addr_req burst=20 nodelay;
  limit_conn addr 50;

  location / {
    root /var/www/frontend;
    try_files $uri /index.html;
  }

  location = /api/auth/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy path for the Marzban admin panel.
  # Accessible at: https://2.26.138.90/panel/admin
  location /panel/ {
    proxy_pass http://marzban:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";

    # Rewrite Marzban redirect Location headers to preserve /panel/ prefix.
    proxy_redirect / /panel/;
    proxy_redirect ~^https?://[^/]+(/.*)$ /panel$1;

    # Rewrite Marzban's absolute static asset paths to include /panel/ prefix.
    sub_filter '/statics/' '/panel/statics/';
    sub_filter_once off;
  }

  # Marzban static assets (JS, CSS, images, favicons).
  location /panel/statics/ {
    proxy_pass http://marzban:8000/statics/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    proxy_buffering on;
    add_header X-Test-Location "panel-statics" always;

    # Rewrite API and page paths inside JS/CSS bundles so they use /panel/ prefix.
    sub_filter '/admin/token' '/panel/admin/token';
    sub_filter '/statics/' '/panel/statics/';
    sub_filter '/api/' '/panel/api/';
    sub_filter '/admin' '/panel/admin';
    sub_filter '/login' '/panel/login';
    sub_filter '/users' '/panel/users';
    sub_filter '/nodes' '/panel/nodes';
    sub_filter '/hosts' '/panel/hosts';
    sub_filter '/inbounds' '/panel/inbounds';
    sub_filter '/node' '/panel/node';
    sub_filter '/system' '/panel/system';
    sub_filter '/core' '/panel/core';
    sub_filter_types text/javascript text/css application/json;
    sub_filter_once off;
  }

  # Marzban API (proxied under /panel/ prefix).
  location /panel/api/ {
    proxy_pass http://marzban:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}

# HTTP → HTTPS redirect for the IP address.
server {
  listen 80;
  server_name 2.26.138.90 localhost _;
  return 301 https://$host$request_uri;
}
