services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/www:/var/www/html:ro
      - frontend-dist:/var/www/frontend:ro
      - ./nginx/logs:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt:ro
    depends_on:
      - backend
      - frontend
      - 3dxui
    networks:
      - vpn-net
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      - PORT=8080
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vpn-net
    restart: unless-stopped
    user: "1000:1000"

  frontend:
    build: ./frontend
    environment:
      - NODE_ENV=production
    volumes:
      - frontend-dist:/app/dist
    networks:
      - vpn-net
    restart: unless-stopped

  init-3dxui:
    build:
      context: ./backend
      dockerfile: Dockerfile.init3dxui
    depends_on:
      3dxui:
        condition: service_healthy
        required: true
    environment:
      X3DXUI_ADMIN_USERNAME: ${X3DXUI_ADMIN_USERNAME:-admin}
      X3DXUI_ADMIN_PASSWORD: ${X3DXUI_ADMIN_PASSWORD:-change_me}
      X3DXUI_URL: http://3dxui:80/panel
      X3DXUI_INBOUND: ${X3DXUI_INBOUND:-vless-reality-xhttp}
      X3DXUI_PUBLIC_HOST: ${X3DXUI_PUBLIC_HOST:-kykyruz.cloud-ip.cc}
    networks:
      - vpn-net
    restart: "no"

  bot:
    build: ./bot
    environment:
      - BOT_TOKEN=${BOT_TOKEN:-7500506542:AAEbwJvm_Y-mteq3cL8zMXWHSJN8yTCx3xw}
      - WEB_APP_URL=${WEB_APP_URL:-https://kykyruz.cloud-ip.cc}
    restart: unless-stopped
    networks:
      - vpn-net
    user: "1000:1000"

  3dxui:
    image: hsanaeii/3x-ui:latest
    environment:
      - XUI_DB_PATH=/etc/x-ui/x-ui.db
      - XUI_LOG_LEVEL=info
      - XUI_INIT_WEB_BASE_PATH=/panel
      - XUI_PORT=80
      - XUI_ADMIN_USERNAME=${X3DXUI_ADMIN_USERNAME:-admin}
      - XUI_ADMIN_PASSWORD=${X3DXUI_ADMIN_PASSWORD:-change_me}
    volumes:
      - 3dxui-data:/etc/x-ui
    networks:
      - vpn-net
    ports:
      - "127.0.0.1:8001:80"
      - "8443:8443"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/panel/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-vpn_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
      POSTGRES_DB: ${DB_NAME:-vpn_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vpn_user} -d ${DB_NAME:-vpn_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vpn-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis-data:/data
      - ./backend/config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vpn-net
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  frontend-dist:
  3dxui-data:

networks:
  vpn-net:
    driver: bridge
